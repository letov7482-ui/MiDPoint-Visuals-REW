name: Build Midpoint Visuals

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.11"

      - name: Unzip project (if ZIP exists)
        shell: bash
        run: |
          echo "Looking for ZIP..."
          ls -la

          if [ -f "midpoint-visuals.zip" ]; then
            echo "Found midpoint-visuals.zip"
            mkdir extracted
            unzip -q midpoint-visuals.zip -d extracted

            echo "Archive contents:"
            find extracted

            shopt -s dotglob

            # Если внутри одна папка — переносим её содержимое
            DIR_COUNT=$(find extracted -mindepth 1 -maxdepth 1 -type d | wc -l)

            if [ "$DIR_COUNT" -eq 1 ]; then
              ROOT_DIR=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n1)
              mv "$ROOT_DIR"/* .
            else
              mv extracted/* .
            fi

            rm -rf extracted
            echo "Extraction complete."
          else
            echo "ZIP not found. Using repository files."
          fi

          echo "Current directory:"
          ls -la

      - name: Generate Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.11
          fi
          chmod +x gradlew

      - name: Build mod
        run: ./gradlew build --no-daemon --stacktrace

      - name: Find JAR
        run: |
          echo "Built JARs:"
          find build/libs -name "*.jar"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: midpoint-visuals-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar

      - name: Create Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
